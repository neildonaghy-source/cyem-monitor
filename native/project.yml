# XcodeGen spec for the native CyEM apps (Mac and iPhone). Generate with: cd native && xcodegen
# The .xcodeproj is generated and git-ignored; this file and the sources are the truth.
name: CyEM
options:
  bundleIdPrefix: com.neildonaghy
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 747JXF57MZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon             # Shared/Assets.xcassets (built by Icon/build_icons.py)
targets:
  CyEM-iOS:
    type: application
    platform: iOS
    scheme: {}                                             # shared schemes for every target, so none is left out
    sources:
      - Shared
      - path: Config                                       # folder: tailnet.json (pre-approved key, not in git) when present
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/ios/TailscaleKit.framework        # scripts/build-tailscalekit.sh
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neildonaghy.cyem
        PRODUCT_NAME: CyEM
        INFOPLIST_FILE: Info/iOS.plist                       # background refresh and Handoff keys, merged
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CyEM
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  CyEM-macOS:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - Shared
      - path: Config                                       # folder: tailnet.json (pre-approved key, not in git) when present
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/macos/TailscaleKit.framework      # scripts/build-tailscalekit.sh
        embed: true
        codeSign: true
    entitlements:
      path: CyEM-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true            # built-in Tailscale's local proxy listens on 127.0.0.1
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neildonaghy.cyem.mac
        PRODUCT_NAME: CyEM
        INFOPLIST_FILE: Info/macOS.plist                     # Handoff key, merged
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CyEM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_HARDENED_RUNTIME: YES
  CyEMTests:                                              # pure logic only (NotifyPlan); no app host, no TailscaleKit
    type: bundle.unit-test
    platform: macOS
    scheme:
      testTargets: [CyEMTests]
    sources:
      - Tests
      - Shared/NotifyPlan.swift
      - Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neildonaghy.cyem.tests
        GENERATE_INFOPLIST_FILE: YES
