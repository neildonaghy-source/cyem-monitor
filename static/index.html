<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyEM Monitor</title>
<meta name="theme-color" content="#10161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CyEM">
<meta name="application-name" content="CyEM Monitor">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a0e13' stroke='%233cc7ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233cc7ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css?v=2026-11-19h">
</head>
<body>
<div id="top">
  <div id="brand">CyEM <span>MONITOR</span></div>
  <div id="clock">--:--Z</div>
  <div id="pills"></div>
  <form id="omni-form" autocomplete="off"><input id="omni-q" type="search" placeholder="Search or ask… ( / )" title="Enter = search everything; Ask AI = answer from CyEM data plus labelled general knowledge; start with ? to ask"><button type="submit" id="omni-go">Search</button><button type="button" id="omni-ask" class="primary">Ask AI</button><label class="omni-web" title="Also search the web (via the self-hosted SearXNG) and cite results as unverified"><input type="checkbox" id="omni-web"> Web</label></form>
  <div id="topbtns">
    <button id="btn-rail" title="Toggle feed rail">Feed</button>
    <button id="btn-side" title="Toggle brief panel">Brief</button>
    <button id="btn-plan" title="Planning: spectrum deconfliction, point-to-point links, coverage, HF skywave">Plan</button>
    <span class="legacy-btns" hidden><button id="btn-spec">Spectrum</button><button id="btn-links">Links</button><button id="btn-cov">Coverage</button><button id="btn-hf">HF</button></span>
    <button id="btn-emo" title="EMO: red / blue ES, EA and EP on terrain (notional)">EMO</button>
    <button id="btn-sdr" title="SDR receivers: live receiver and spectrum sweeps">SDR</button>
    <button id="btn-health" title="Collector health">Health</button>
    <button id="btn-signout" hidden>Sign out</button>
  </div>
</div>

<div id="app">
<aside id="rail" class="hidden">
  <div class="tabs" id="dom-tabs">
    <button data-dom="all" class="active">All</button>
    <button data-dom="cyber">Cyber</button>
    <button data-dom="em">EM</button>
    <button data-dom="infra">Infra</button>
    <button data-dom="osint">OSINT</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search items (FTS)…">
    <label><input type="checkbox" id="hi-only"> sev ≥3</label>
    <select id="hours" title="Window">
      <option value="24">24h</option>
      <option value="48" selected>48h</option>
      <option value="168">7d</option>
      <option value="720">30d</option>
    </select>
  </div>
  <div id="feed"><div class="empty">Loading…</div></div>
</aside>

<div id="map">
  <div id="layers">
    <h3><span>Layers</span><a href="#" id="layers-toggle">hide</a></h3>
  </div>
  <div id="legend"></div>
</div>

<aside id="side" class="hidden">
  <div class="panel-head">
    <h2>Intelligence brief</h2>
    <button id="btn-gen" class="primary" title="Generate a fresh brief with Ollama">Regenerate</button>
  </div>
  <div id="brief-wrap">
    <div id="brief-meta"></div>
    <div id="brief-notice"></div>
    <div id="brief" class="md"><div class="empty">No brief yet. Press Regenerate once collectors have run.</div></div>
  </div>
  <div id="ask">
    <form id="ask-form">
      <input id="ask-q" type="text" placeholder="Ask the monitor… e.g. what is affecting GNSS in the Baltic?" autocomplete="off">
      <button type="submit" id="ask-btn">Ask</button>
    </form>
    <div id="answer"></div>
  </div>
</aside>
</div>

<nav id="mobnav">
  <button data-view="map" class="active">Map</button>
  <button data-view="rail">Feed</button>
  <button data-view="side">Brief</button>
  <button id="mob-tools" type="button">Tools</button>
</nav>

<div id="omni-out"><div class="omni-head"><span>Search / Ask AI</span><button id="omni-close">Close</button></div><div id="omni-body"></div></div>
<div id="modal"><div class="box">
  <div class="panel-head"><h2 id="modal-title">Details</h2><button id="modal-close">Close</button></div>
  <div class="body" id="modal-body"></div>
</div></div>

<script src="/static/vendor/leaflet.js"></script>
<script src="/static/vendor/marked.umd.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/milsymbol.js"></script>
<script src="/api/prefs/startup.js"></script>
<script src="/static/app.js?v=2026-11-19h"></script>
</body>
</html>
