<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyEM Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a0e13' stroke='%233cc7ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233cc7ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="top">
  <div id="brand">CyEM <span>MONITOR</span></div>
  <div id="clock">--:--Z</div>
  <div id="pills"></div>
  <div id="topbtns">
    <button id="btn-rail" class="active" title="Toggle feed rail">Feed</button>
    <button id="btn-side" class="active" title="Toggle brief panel">Brief</button>
    <button id="btn-health" title="Collector health">Health</button>
  </div>
</div>

<div id="app">
<aside id="rail">
  <div class="tabs" id="dom-tabs">
    <button data-dom="all" class="active">All</button>
    <button data-dom="cyber">Cyber</button>
    <button data-dom="em">EM</button>
    <button data-dom="infra">Infra</button>
    <button data-dom="osint">OSINT</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search items (FTS)…">
    <label><input type="checkbox" id="hi-only"> sev ≥3</label>
    <select id="hours" title="Window">
      <option value="24">24h</option>
      <option value="48" selected>48h</option>
      <option value="168">7d</option>
      <option value="720">30d</option>
    </select>
  </div>
  <div id="feed"><div class="empty">Loading…</div></div>
</aside>

<div id="map">
  <div id="layers">
    <h3><span>Layers</span><a href="#" id="layers-toggle">hide</a></h3>
  </div>
  <div id="legend"></div>
</div>

<aside id="side">
  <div class="panel-head">
    <h2>Intelligence brief</h2>
    <button id="btn-gen" class="primary" title="Generate a fresh brief with Ollama">Regenerate</button>
  </div>
  <div id="brief-wrap">
    <div id="brief-meta"></div>
    <div id="brief-notice"></div>
    <div id="brief" class="md"><div class="empty">No brief yet. Press Regenerate once collectors have run.</div></div>
  </div>
  <div id="ask">
    <form id="ask-form">
      <input id="ask-q" type="text" placeholder="Ask the monitor… e.g. what is affecting GNSS in the Baltic?" autocomplete="off">
      <button type="submit" id="ask-btn">Ask</button>
    </form>
    <div id="answer"></div>
  </div>
</aside>
</div>

<nav id="mobnav">
  <button data-view="map" class="active">Map</button>
  <button data-view="rail">Feed</button>
  <button data-view="side">Brief</button>
</nav>

<div id="modal"><div class="box">
  <div class="panel-head"><h2 id="modal-title">Details</h2><button id="modal-close">Close</button></div>
  <div class="body" id="modal-body"></div>
</div></div>

<script src="/static/vendor/leaflet.js"></script>
<script src="/static/vendor/marked.umd.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
